<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>∞</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css?v=pointer-press">
    <script src="./app.js?v=pointer-press" defer></script>
  </head>
  <body>
    <main class="app-shell" aria-label="Infinite todo app">
      <section class="todo-board" id="todoBoard">
        <div class="board-title-wrap">
          <button class="board-title" id="boardTitle" type="button" aria-label="Rename current list"></button>
        </div>
        <form class="title-editor" id="titleEditor" hidden>
          <input id="titleInput" type="text" autocomplete="off" spellcheck="false" aria-label="List title">
        </form>
        <div class="viewport" id="viewport">
          <div class="list-stage" id="listStage"></div>
        </div>
      </section>
    </main>
  </body>
</html>
